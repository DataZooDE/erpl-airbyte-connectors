name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  static:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-sap
    steps:
      - uses: actions/checkout@v4
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - run: poetry install --all-extras
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pytest unit_tests -q

  image:
    name: Build the connector image and run Airbyte's standard tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-sap
    steps:
      - uses: actions/checkout@v4
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - run: poetry install --all-extras
      - name: Build
        run: ./bin/build-image.sh
      - name: The image must run spec with no network access
        run: |
          docker run --rm --network none airbyte/source-sap:dev spec > spec.jsonl
          grep -q '"type":"SPEC"' spec.jsonl
      - name: Airbyte standard connector tests
        run: poetry run airbyte-cdk image test --no-creds
      - name: The image must carry its extensions
        run: poetry run pytest integration_tests/test_image_carries_its_extensions.py -v
      - name: The image must run check smoke test
        run: |
          echo '{"ashost": "127.0.0.1", "sysnr": "00", "client": "001", "user": "SMOKE_TEST", "password": "FAKE", "protocol": {"mode": "rfc", "table_pattern": "SFLIGHT"}}' > /tmp/smoke-config.json
          OUTPUT=$(docker run --rm -v /tmp/smoke-config.json:/config.json airbyte/source-sap:dev check --config /config.json)
          rm -f /tmp/smoke-config.json
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '"connectionStatus":{"status":"FAILED"'
          echo "$OUTPUT" | grep -q 'SAP RFC connection test failed'
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_REPO="ghcr.io/${OWNER_LC}/source-sap"
          TAG="$(python3 -c "import re,pathlib;print(re.search(r'dockerImageTag: (\S+)', pathlib.Path('metadata.yaml').read_text()).group(1))")"
          docker tag airbyte/source-sap:dev "${GHCR_REPO}:${TAG}"
          docker tag airbyte/source-sap:dev "${GHCR_REPO}:latest"
          docker tag airbyte/source-sap:dev "${GHCR_REPO}:2026.9.4"
          docker push "${GHCR_REPO}:${TAG}"
          docker push "${GHCR_REPO}:latest"
          docker push "${GHCR_REPO}:2026.9.4"

  e2e:
    name: End-to-end against the SAP sandbox
    # The ABAP trial is too large for a hosted runner; this needs the self-hosted
    # box where the a4h container lives.
    runs-on: [self-hosted, sap-sandbox]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: source-sap
    env:
      ERPL_SAP_ASHOST: localhost
      ERPL_SAP_SYSNR: "00"
      ERPL_SAP_CLIENT: "001"
      ERPL_SAP_USER: DEVELOPER
      ERPL_SAP_PASSWORD: ${{ secrets.SAP_A4H_PASSWORD }}
      ERPL_SAP_LANG: EN
      ERPL_SAP_BASE_URL: http://localhost:50000
      # Absent rather than empty when unset -- the fixtures skip on absence only.
      ERPL_SAP_ODP_CONTEXT: ${{ vars.SAP_ODP_CONTEXT }}
      ERPL_SAP_ODP_NAME: ${{ vars.SAP_ODP_NAME }}
      ERPL_SAP_ODP_ODATA_URL: ${{ vars.SAP_ODP_ODATA_URL }}
      ERPL_SAP_BICS_CUBE: ${{ vars.SAP_BICS_CUBE }}
      ERPL_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - run: poetry install --all-extras
      - name: Fetch the ERPL extensions
        run: ./bin/fetch-extensions.sh "$PWD/.erpl"
      - name: Airbyte standard connector tests
        run: |
          export ERPL_EXTENSION_DIR="$PWD/.erpl"
          export LD_LIBRARY_PATH="$PWD/.erpl/v1.5.5/linux_amd64"
          ./bin/write-secrets.sh
          ./bin/build-image.sh
          poetry run pytest integration_tests -q --connector-image airbyte/source-sap:dev

      - name: Run the e2e suite
        run: |
          export ERPL_EXTENSION_DIR="$PWD/.erpl"
          export LD_LIBRARY_PATH="$PWD/.erpl/v1.5.5/linux_amd64"
          # Fails the job if any protocol would silently skip for want of a
          # variable, rather than reporting green on a suite that did not run.
          export ERPL_E2E_REQUIRED=1
          poetry run pytest e2e -q -m "not slow"

      - name: Volume tests
        # Six-figure extracts; kept out of the fast lane.
        run: |
          export ERPL_EXTENSION_DIR="$PWD/.erpl"
          export LD_LIBRARY_PATH="$PWD/.erpl/v1.5.5/linux_amd64"
          poetry run pytest e2e -q -m slow
