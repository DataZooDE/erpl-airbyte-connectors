[project]
name = "source-sap"
version = "1.0.0"
description = "Airbyte source for SAP ERP, BW and ODP, powered by the ERPL DuckDB extensions (https://erpl.io)."
authors = [{ name = "DataZoo GmbH", email = "info@data-zoo.de" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "airbyte-cdk>=7.28,<8",
    "duckdb>=1.5.5,<2",
]

[project.urls]
Homepage = "https://erpl.io"
Repository = "https://github.com/DataZooDE/erpl-airbyte-connectors"
Documentation = "https://docs.airbyte.com/integrations/sources/sap"

[project.scripts]
source-sap = "source_sap.run:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source_sap"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.6",
    "mypy>=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["unit_tests", "integration_tests", "e2e"]
markers = [
    "requires_creds: needs a live SAP system (the local a4h ABAP trial)",
    "slow: long-running test",
]
